<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>君立自建房 · 三维户型</title>
<style>
  :root{
    --bg:#0d1117; --panel:rgba(22,27,34,.78); --line:rgba(255,255,255,.10);
    --text:#e6edf3; --dim:#8b949e; --accent:#4fa3ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;color:var(--text)}
  canvas{display:block}
  .hud{position:fixed;z-index:10}

  /* ---- title ---- */
  #title{top:20px;left:20px;background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:14px;padding:14px 18px;min-width:210px}
  #title h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.3px}
  #title .sub{margin-top:5px;font-size:11.5px;color:var(--dim);line-height:1.6}
  #title .sub b{color:var(--text);font-weight:500}

  /* ---- floors ---- */
  #floors{bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:6px;
    background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);
    border-radius:12px;padding:6px}
  #floors button{appearance:none;border:0;background:transparent;color:var(--dim);
    font:500 13px/1 inherit;padding:9px 16px;border-radius:8px;cursor:pointer;
    transition:.18s;font-family:inherit;white-space:nowrap}
  #floors button:hover{color:var(--text);background:rgba(255,255,255,.06)}
  #floors button.on{background:var(--accent);color:#06111f}

  /* ---- panel ---- */
  #panel{top:20px;right:20px;width:210px;background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .row{margin-bottom:14px}
  .row:last-child{margin-bottom:0}
  .lbl{font-size:11px;color:var(--dim);display:flex;justify-content:space-between;margin-bottom:7px}
  .lbl span:last-child{color:var(--text);font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;width:100%;height:3px;border-radius:2px;
    background:rgba(255,255,255,.16);outline:0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
    border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 3px rgba(79,163,255,.18)}
  .tog{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;
    color:var(--dim);cursor:pointer;user-select:none;padding:3px 0}
  .tog .sw{width:34px;height:19px;border-radius:10px;background:rgba(255,255,255,.14);
    position:relative;transition:.2s;flex:0 0 auto}
  .tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;
    border-radius:50%;background:#fff;transition:.2s}
  .tog.on .sw{background:var(--accent)}
  .tog.on .sw::after{transform:translateX(15px)}
  .tog.on{color:var(--text)}

  /* ---- loading ---- */
  #loading{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:16px;background:var(--bg);transition:opacity .5s}
  #loading.hide{opacity:0;pointer-events:none}
  .spin{width:34px;height:34px;border:2.5px solid rgba(255,255,255,.14);
    border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #loading p{margin:0;font-size:12.5px;color:var(--dim);letter-spacing:.5px}
  #err{color:#ff7b72;font-size:12px;max-width:70%;text-align:center;line-height:1.6}
  #hint{position:fixed;bottom:26px;left:20px;font-size:11px;color:#4d5866;z-index:9}
  @media(max-width:720px){
    #panel{display:none} #title{padding:11px 14px;min-width:0} #hint{display:none}
    /* 手机：楼层条收紧，标题缩小，避免换行与遮挡 */
    #floors{bottom:18px;gap:2px;padding:5px}
    #floors button{padding:9px 10px;font-size:12px}
    #title{left:12px;top:12px;max-width:calc(100vw - 24px)}
    #title h1{font-size:13.5px}
    #title .sub{font-size:10.5px;line-height:1.5}
  }
</style>
</head>
<body>
<div id="loading"><div class="spin"></div><p>正在载入三维模型…</p><div id="err"></div></div>

<div id="title" class="hud">
  <h1>君立自建房 · 三层</h1>
  <div class="sub" id="stats">框架结构 · 壳体模型</div>
</div>

<div id="panel" class="hud">
  <div class="row">
    <div class="lbl"><span>剖切高度</span><span id="cutv">关闭</span></div>
    <input id="cut" type="range" min="0" max="100" value="100" />
  </div>
  <div class="row">
    <div class="tog on" id="tFloor"><span>显示楼板</span><span class="sw"></span></div>
    <div class="tog" id="tSpin"><span>自动旋转</span><span class="sw"></span></div>
    <div class="tog on" id="tExplode"><span>分层展开</span><span class="sw"></span></div>
    <div class="tog on" id="tEdge"><span>显示轮廓线</span><span class="sw"></span></div>
  </div>
</div>

<div id="floors" class="hud">
  <button data-f="0" class="on">全楼</button>
  <button data-f="1">一层</button>
  <button data-f="2">二层</button>
  <button data-f="3">三层</button>
</div>

<div id="hint">左键拖动旋转 · 滚轮缩放 · 右键平移</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/jsm/controls/OrbitControls.js';
import { GLTFLoader } from './vendor/jsm/loaders/GLTFLoader.js';

// 优先加载带材质的 design.glb，没有则退回 M1 白模
const MODEL = await (async () => {
  for (const u of ['./models/design.glb', './models/house.glb']) {
    try { const r = await fetch(u, { method: 'HEAD' }); if (r.ok) return u; } catch (e) {}
  }
  return '../out/house.glb';
})();

/* ---------------------------------------------------------------- renderer */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
scene.fog = new THREE.Fog(0x0d1117, 60, 150);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, .1, 500);
camera.position.set(22, 20, 26);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .07;
controls.maxPolarAngle = Math.PI * .495;
controls.minDistance = 4;
controls.maxDistance = 120;

/* ------------------------------------------------------------------ lights */
scene.add(new THREE.HemisphereLight(0xbfd4f2, 0x1b2028, 1.15));

const key = new THREE.DirectionalLight(0xfff2e0, 2.1);
key.position.set(26, 38, 16);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 140;
const sc = 26;
Object.assign(key.shadow.camera, { left: -sc, right: sc, top: sc, bottom: -sc });
key.shadow.bias = -0.0008;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9dc4ff, .55);
fill.position.set(-20, 14, -18);
scene.add(fill);

/* -------------------------------------------------------------------- grid */
const grid = new THREE.GridHelper(160, 80, 0x233043, 0x18202b);
grid.position.y = -0.16;
scene.add(grid);

/* --------------------------------------------------------------- clip plane */
const clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), -100);
const state = { cut: 100, showFloor: true, spin: false, edges: true, explode: true, floor: 0 };
const EXPLODE_GAP = 1.4;   // meters between storeys in exploded view

/* ------------------------------------------------------------------- load */
const groups = {};         // floor index -> [objects]
const slabs = [];          // slab meshes
const ceilings = [];       // 天花/屋顶：分层展开时挡住内部，展开时自动隐藏
const edgeMats = new Map();
let house = null, box = null, heights = [];

new GLTFLoader().load(MODEL, (gltf) => {
  house = gltf.scene;
  scene.add(house);

  house.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true;
    o.receiveShadow = true;
    const m = o.material;
    m.side = THREE.DoubleSide;
    m.clippingPlanes = [clipPlane];
    m.envMapIntensity = .6;

    const name = o.name || '';
    const fi = parseInt((name.match(/^F(\d)/) || [])[1] || '1', 10);
    (groups[fi] = groups[fi] || []).push(o);
    if (/Slab/i.test(name)) slabs.push(o);
    if (/Ceiling|Roof/i.test(name)) ceilings.push(o);

    // crisp outline that follows the same clipping plane
    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(o.geometry, 28),
      new THREE.LineBasicMaterial({ color: 0x33465e, transparent: true, opacity: .55,
                                    clippingPlanes: [clipPlane] })
    );
    edges.name = 'edge:' + name;
    o.add(edges);
    edgeMats.set(edges, true);
  });

  box = new THREE.Box3().setFromObject(house);
  const size = box.getSize(new THREE.Vector3());
  const c = box.getCenter(new THREE.Vector3());
  heights = Object.keys(groups).sort().map((k) => {
    const b = new THREE.Box3();
    groups[k].forEach((o) => b.expandByObject(o));
    return { floor: +k, min: b.min.y, max: b.max.y };
  });

  // 竖屏手机视野窄，机位要退得更远，否则模型被裁掉
  const fitK = innerWidth < innerHeight ? 2.6 : 1.5;
  controls.target.copy(c);
  camera.position.set(c.x + size.x * fitK, c.y + size.y * (fitK * 0.9),
                      c.z + size.z * fitK);
  controls.update();

  const area = { 1: 191.1, 2: 191.1, 3: 191.1 };
  const total = Object.values(area).reduce((a, b) => a + b, 0);
  document.getElementById('stats').innerHTML =
    `占地 <b>${size.x.toFixed(1)} × ${size.z.toFixed(1)} m</b> · 总高 <b>${size.y.toFixed(1)} m</b><br>` +
    `三层建筑面积合计 <b>约 ${total.toFixed(0)} m²</b><br>` +
    `构件 <b>${house.children.length}</b> 组 · 由 DXF 自动生成`;

  scene.fog.far = Math.max(120, size.y * 12);
  applyFloor();
  applyExplode();
  setTimeout(() => document.getElementById('loading').classList.add('hide'), 260);
}, undefined, (e) => {
  document.getElementById('err').textContent =
    '模型载入失败：' + (e && e.message ? e.message : e) +
    '（请确认通过本地 HTTP 服务访问，而非 file://）';
});

/* ------------------------------------------------------------------ update */
function applyClip() {
  const top = box ? box.max.y + 1 : 10;
  if (state.cut >= 100) {
    clipPlane.constant = top;                       // nothing clipped
    document.getElementById('cutv').textContent = '关闭';
  } else {
    const h = box.min.y + (top - box.min.y) * (state.cut / 100);
    clipPlane.constant = h;
    document.getElementById('cutv').textContent = h.toFixed(2) + ' m';
  }
}

function applyFloor() {
  const f = state.floor;
  Object.entries(groups).forEach(([k, arr]) => {
    arr.forEach((o) => { o.visible = (f === 0) || (+k === f); });
  });
  if (f !== 0) {
    const h = heights.find((x) => x.floor === f);
    if (h) {
      controls.target.y = (h.min + h.max) / 2;
    }
  }
  applySlabs();
  applyEdges();
}

function applyExplode() {
  Object.entries(groups).forEach(([k, arr]) => {
    const dy = state.explode ? (+k - 1) * EXPLODE_GAP : 0;
    arr.forEach((o) => { o.position.y = dy; });
  });
  // 展开时把天花藏掉，否则每一层顶部是一块板，看不到室内
  ceilings.forEach((o) => { o.visible = !state.explode || state.cut < 100; });
}

function applySlabs() {
  slabs.forEach((o) => {
    const fi = parseInt((o.name.match(/^F(\d)/) || [])[1] || '1', 10);
    o.visible = state.showFloor && (state.floor === 0 || state.floor === fi);
  });
}

function applyEdges() {
  edgeMats.forEach((_, e) => { e.visible = state.edges; });
}

/* -------------------------------------------------------------------- UI */
const cut = document.getElementById('cut');
cut.addEventListener('input', () => {
  state.cut = +cut.value;
  // 剖切与分层展开同时用时会把楼板切在半空，自动收起展开
  if (state.cut < 100 && state.explode) {
    state.explode = false;
    document.getElementById('tExplode').classList.remove('on');
    applyExplode();
  }
  applyClip();
});

document.querySelectorAll('#floors button').forEach((b) => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#floors button').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    state.floor = +b.dataset.f;
    applyFloor();
  });
});

function toggle(id, key, cb) {
  const el = document.getElementById(id);
  el.addEventListener('click', () => {
    state[key] = !state[key];
    el.classList.toggle('on', state[key]);
    cb();
  });
}
toggle('tFloor', 'showFloor', applySlabs);
toggle('tExplode', 'explode', applyExplode);
toggle('tSpin', 'spin', () => {});
toggle('tEdge', 'edges', applyEdges);

/* ------------------------------------------------------------------- loop */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  if (state.spin && house) house.rotation.y += 0.0016;
  controls.update();
  renderer.render(scene, camera);
});

applyClip();
applyExplode();
</script>
</body>
</html>
